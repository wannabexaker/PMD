version: 2
# Monthly, one grouped PR per ecosystem. PMD is a demo: a dozen weekly PRs
# nobody merges are noise, and each frontend PR also costs a Vercel preview.
# Major versions are left out of the groups' automation on purpose (they get
# their own PR) and are worth a deliberate look, e.g. Java 21 -> 24 or Vite 7 -> 8.
updates:
  - package-ecosystem: "npm"
    directory: "/frontend/pmd-frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "frontend"]
    groups:
      frontend:
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/backend/pmd-backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "backend"]
    groups:
      backend:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  # Only the backend image is deployed (on the Pi). The frontend Dockerfile is
  # for the local review stack and does not need its own update stream.
  - package-ecosystem: "docker"
    directory: "/backend/pmd-backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "docker"]
