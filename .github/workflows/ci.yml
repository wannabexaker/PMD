name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.deps.yml config >/dev/null
          docker compose -f docker-compose.local.yml config >/dev/null
          # Throwaway values, only so the ${VAR:?} guards in the deploy stacks resolve. Those
          # stacks fail fast on a missing secret by design, so every required var must be listed
          # here — otherwise adding one only breaks at deploy time, on the box.
          export MONGO_INITDB_ROOT_USERNAME=ci-root
          export MONGO_INITDB_ROOT_PASSWORD=ci-root-pass
          export PMD_MONGO_APP_USER=ci-pmd
          export PMD_MONGO_APP_PASSWORD=ci-pmd-pass
          export PMD_ALLOWED_ORIGINS=http://ci.example.com
          export PMD_APP_BASE_URL=http://ci.example.com
          export PMD_JWT_SECRET=ci-compose-validation-secret-32bytes
          export PMD_SECURITY_CLIENT_METADATA_HASH_SALT=ci-compose-validation-salt-32bytes
          export PMD_SECURITY_ADMIN_EMAILS=ci-admin@example.com
          # Validating the Pi stack here means a broken
          # interpolation cannot first surface on the Pi itself.
          docker compose -f docker-compose.pi.yml config >/dev/null

      - name: Validate nginx config
        run: |
          docker run --rm \
            -v "$PWD/frontend/pmd-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine \
            nginx -t

  frontend:
    runs-on: ubuntu-latest
    needs: infra
    defaults:
      run:
        working-directory: frontend/pmd-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/pmd-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Vercel builds from the repo too; this catches a broken build (e.g. a ?raw legal
      # import) before a deploy does.
      - name: Build
        run: npm run build

      - name: Dependency audit (high)
        run: npm audit --audit-level=high
        continue-on-error: true

      # The build output is deliberately not uploaded. Nothing consumes it: no
      # workflow downloads it, and Release builds its images from source. The
      # signal we want from this job is whether the build succeeds, which the
      # job status already carries.

  backend:
    runs-on: ubuntu-latest
    needs: infra
    # Production runs mongo:4.4.18 (the last build the Pi 4 CPU can run); dev uses 7.
    # Both, so a query that only works on one fails here and not on the Pi.
    strategy:
      fail-fast: false
      matrix:
        include:
          - mongo: "mongo:7"
            shell: mongosh
          - mongo: "mongo:4.4.18"
            shell: mongo
    name: backend (${{ matrix.mongo }})
    services:
      mongo:
        image: ${{ matrix.mongo }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "${{ matrix.shell }} --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/pmd
    defaults:
      run:
        working-directory: backend/pmd-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Ensure mvnw executable
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw -q -DskipTests=false test

      - name: DB schema/index gate
        run: ./mvnw -q -Dtest=DatabaseIndexGateTest test

      - name: DB contract gate
        run: ./mvnw -q -Dtest=DatabaseContractGateTest test

      - name: Package
        run: ./mvnw -q -Dmaven.test.skip=true package
      # The jar is deliberately not uploaded — see the note in the frontend job.


