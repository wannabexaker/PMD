name: Release

# Builds the backend image the Pi runs. The frontend is not built here: Vercel
# builds and serves it straight from the repo. Nothing deploys automatically;
# the Pi pulls a pinned :<sha> or :v* tag by hand (docs/OPERATIONS.md).
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository_owner }}/pmd-backend
  # build-push-action uploads a .dockerbuild record artifact per image by
  # default. They are never read back and accumulate one per build.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure mvnw executable
        run: chmod +x backend/pmd-backend/mvnw

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute backend tags
        id: backend-tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/pmd-backend
          file: ./backend/pmd-backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.backend-tags.outputs.tags }}
