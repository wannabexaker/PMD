# PMD — Raspberry Pi 4 (architecture B): backend + MongoDB.
#
# The React frontend is served by Vercel (pmd.olamov.com); ONLY the API lives
# here and is reachable exclusively through Cloudflare (api-pmd.olamov.com).
# The backend publishes 127.0.0.1:8080 on the host — loopback only, so the
# Pi's host-level Cloudflare Tunnel can reach it and nothing on the LAN or the
# internet can. Mongo is not published at all and stays on an internal network.
#
# This file mirrors what actually runs on the Pi. There is no tunnel service here:
# the Pi runs one host-level Cloudflare Tunnel for every project, and it maps
# api-pmd.olamov.com to http://localhost:8080.
#
# Usage on the Pi:
#   cp .env.pi.example .env && chmod 600 .env   # then fill in the real secrets
#   docker compose -f docker-compose.pi.yml pull
#   docker compose -f docker-compose.pi.yml up -d
#
# Compose loads .env from this file's directory by itself — no --env-file flag.
# The project name is fixed below, so containers and volumes stay pmd-* / pmd_*
# whatever the folder is called (~/pmd today, ~/projects/pmd as the target).
name: pmd

# The Pi is shared by every project: each service gets a hard memory and CPU ceiling and
# rotated logs, so PMD can never starve its neighbours or fill the SD card.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    # Pinned to 4.4.18: the Raspberry Pi 4 CPU (Cortex-A72) is ARMv8.0-A, but
    # MongoDB >= 5.0 AND >= 4.4.19 require ARMv8.2-A ("Illegal instruction"
    # crash otherwise). 4.4.18 is the last build that runs on the Pi 4.
    image: mongo:4.4.18
    restart: unless-stopped
    # WiredTiger would size its cache to ~half the host's RAM; diagnostic.data grows to 200 MB.
    command: ["mongod", "--auth", "--bind_ip_all",
              "--wiredTigerCacheSizeGB", "0.25",
              "--setParameter", "diagnosticDataCollectionDirectorySizeMB=50"]
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set in .env}
      PMD_MONGO_APP_DB: ${PMD_MONGO_APP_DB:-pmd}
      PMD_MONGO_APP_USER: ${PMD_MONGO_APP_USER:?set in .env}
      PMD_MONGO_APP_PASSWORD: ${PMD_MONGO_APP_PASSWORD:?set in .env}
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo/init/01-init-pmd-user.sh:/docker-entrypoint-initdb.d/01-init-pmd-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  backend:
    # Pin PMD_BACKEND_TAG in .env to a commit sha or v* tag; :latest moves on every push to main.
    image: ghcr.io/${GHCR_OWNER:-wannabexaker}/pmd-backend:${PMD_BACKEND_TAG:-latest}
    mem_limit: 640m
    cpus: 1.0
    logging: *default-logging
    # Loopback only: Docker bypasses the Pi's firewall, so 0.0.0.0 would expose the
    # API to the whole home network. The host tunnel connects to 127.0.0.1:8080.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,prod}
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://${PMD_MONGO_APP_USER}:${PMD_MONGO_APP_PASSWORD}@mongo:27017/${PMD_MONGO_APP_DB:-pmd}?authSource=${PMD_MONGO_APP_DB:-pmd}}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      PMD_MAIL_FROM: ${PMD_MAIL_FROM:-no-reply@olamov.com}
      # Soft launch has no SMTP server, so exclude the mail check from health
      # (otherwise /actuator/health reports DOWN on the refused SMTP connection).
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      PMD_APP_BASE_URL: ${PMD_APP_BASE_URL:?public SPA origin, e.g. https://pmd.olamov.com}
      PMD_JWT_SECRET: ${PMD_JWT_SECRET:?set in .env}
      PMD_JWT_EXPIRATIONSECONDS: ${PMD_JWT_EXPIRATIONSECONDS:-900}
      PMD_AUTH_SESSION_COOKIE_SECURE: ${PMD_AUTH_SESSION_COOKIE_SECURE:-true}
      PMD_AUTH_SESSION_COOKIE_SAME_SITE: ${PMD_AUTH_SESSION_COOKIE_SAME_SITE:-Lax}
      # The SPA (pmd.olamov.com) calls this API (api-pmd.olamov.com) directly and reads the
      # CSRF token from document.cookie, so that one cookie is set on the shared parent domain.
      # The refresh-token cookie stays HttpOnly and host-only on the API.
      PMD_AUTH_CSRF_COOKIE_DOMAIN: ${PMD_AUTH_CSRF_COOKIE_DOMAIN:-olamov.com}
      PMD_AUTH_REQUIRE_VERIFIED_EMAIL: ${PMD_AUTH_REQUIRE_VERIFIED_EMAIL:-false}
      PMD_SECURITY_TRUST_PROXY_HEADERS: ${PMD_SECURITY_TRUST_PROXY_HEADERS:-true}
      # Salts the fingerprint stored alongside the masked IP. Without it the hash is an
      # unsalted SHA-256 and, since the /24 is stored in clear, the last octet has only 256
      # candidates — the "anonymised" IP is recoverable instantly. Must be set.
      PMD_SECURITY_CLIENT_METADATA_HASH_SALT: ${PMD_SECURITY_CLIENT_METADATA_HASH_SALT:?generate one, e.g. openssl rand -hex 32}
      # Only these emails may hold the platform-admin flag: any other isAdmin bit found in
      # the database is stripped at startup. Blank would disable that sweep, so in
      # production it is required on purpose.
      PMD_SECURITY_ADMIN_EMAILS: ${PMD_SECURITY_ADMIN_EMAILS:?comma-separated admin emails}
      PMD_ALLOWED_ORIGINS: ${PMD_ALLOWED_ORIGINS:?e.g. https://pmd.olamov.com}
      PMD_ALLOWED_ORIGIN_PATTERNS: ${PMD_ALLOWED_ORIGIN_PATTERNS:-}
      # Google Sign-In (public OAuth client id) + Cloudflare Turnstile secret.
      # Both optional: empty = that feature stays disabled.
      PMD_GOOGLE_CLIENT_ID: ${PMD_GOOGLE_CLIENT_ID:-}
      PMD_TURNSTILE_SECRET: ${PMD_TURNSTILE_SECRET:-}
      # Public-demo caps (0 = unlimited). Demo workspaces delete themselves after the TTL;
      # the user can create a new one. Each user owns at most one workspace besides it.
      PMD_DEMO_WORKSPACE_TTL_DAYS: ${PMD_DEMO_WORKSPACE_TTL_DAYS:-7}
      PMD_LIMITS_MAX_ACCOUNTS: ${PMD_LIMITS_MAX_ACCOUNTS:-200}
      PMD_LIMITS_MAX_OWNED_WORKSPACES: ${PMD_LIMITS_MAX_OWNED_WORKSPACES:-1}
      PMD_LIMITS_WORKSPACE_MAX_PROJECTS: ${PMD_LIMITS_WORKSPACE_MAX_PROJECTS:-30}
      PMD_LIMITS_WORKSPACE_MAX_MEMBERS: ${PMD_LIMITS_WORKSPACE_MAX_MEMBERS:-25}
      PMD_LIMITS_WORKSPACE_MAX_TEAMS: ${PMD_LIMITS_WORKSPACE_MAX_TEAMS:-10}
      # Uploads: total size cap for the uploads volume, and uploads per account per hour.
      PMD_UPLOADS_MAX_TOTAL_MB: ${PMD_UPLOADS_MAX_TOTAL_MB:-200}
      PMD_UPLOADS_RATE_LIMIT_PER_HOUR: ${PMD_UPLOADS_RATE_LIMIT_PER_HOUR:-5}
      # Heap = 60% of the 640m container limit; the rest is metaspace, threads and code cache.
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=60}
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - uploads:/app/uploads
    networks:
      - app
      - data

volumes:
  mongo_data:
  uploads:

networks:
  # Not internal: Docker cannot publish a port for a container attached only to
  # internal networks, and the backend's loopback port is how the host tunnel
  # reaches it. Ingress is still limited to 127.0.0.1 by the port binding above.
  app:
  # Internal: Mongo has no route in or out.
  data:
    internal: true
